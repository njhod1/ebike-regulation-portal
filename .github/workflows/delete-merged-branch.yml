name: Delete merged branch
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  delete:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - run: git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" --delete "${{ github.event.pull_request.head.ref }}"
        continue-on-error: true
